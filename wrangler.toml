# ============================================================================
# پیکربندی Cloudflare Workers برای ربات فروش کانفیگ VPN و پنل ادمین
# ============================================================================
name = "telegram-vpn-bot-hono"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[[kv_namespaces]]
binding = "BOT_KV"
id = "7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c"
preview_id = "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d"

[vars]
BOT_NAME = "ربات اختصاصی فروش کانفیگ پرسرعت"
ENVIRONMENT = "production"
ADMIN_USERNAME = "admin"

# اطلاعات اتصال به پنل مرزبان (Marzban Panel)
MARZBAN_URL = "https://sub.myvpnserver.net"

# اطلاعات پرداخت کارت‌به‌کارت
CARD_NUMBER = "6037-9975-1234-5678"
CARD_HOLDER = "به نام مدیریت سرویس"

# متغیرهای محرمانه با دستور زیر ثبت شوند:
# npx wrangler secret put TELEGRAM_BOT_TOKEN
# npx wrangler secret put MARZBAN_TOKEN
# npx wrangler secret put ADMIN_PASSWORD
